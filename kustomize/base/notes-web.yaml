apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-web
  labels: { app: notes-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: notes-web }
  template:
    metadata:
      labels: { app: notes-web }
    spec:
      containers:
        - name: web
          image: localhost:5001/notes-web:1.0.0
          ports:
            - { containerPort: 8080, name: http }
          env:
            - name: API_UPSTREAM
              value: "notes-api:8000"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notes-web
  labels: { app: notes-web }
spec:
  selector: { app: notes-web }
  ports:
    - { name: http, port: 8080, targetPort: http }
