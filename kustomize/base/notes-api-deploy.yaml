apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  labels: { app: notes-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: notes-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: notes-api }
    spec:
      containers:
        - name: api
          image: localhost:5001/notes-api:1.0.0
          ports:
            - { containerPort: 8000, name: http }
          envFrom:
            - configMapRef: { name: notes-config }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: DB_HOST
              value: notes-db
            - name: DB_NAME
              value: notes
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: notes-db, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: notes-db, key: DB_PASSWORD } }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
